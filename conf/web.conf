user egret;

worker_processes 4;

error_log /var/log/egret-web-server/error.log;
pid /run/egret-web-server.pid;

events {
    worker_connections 1024;
}

http {
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/egret-web-server/access.log  main;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 2048;
    default_type        application/octet-stream;

    server {
        listen       80;
        server_name  localhost;
        server_name  127.0.0.1;
        root ./www;
        
        location = /install.sh {
        }

        location = /index.html {
        } 
 
        # 所有流量转发给本地 127.0.0.1:8000
        location / {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_read_timeout 60s;
        }
        
        # PHP核心转发规则
        location ~ \.php$ {
            # 转发到PHP-FPM TCP地址
            # fastcgi_pass 127.0.0.1:9000;
            fastcgi_pass unix:/run/php/php8.3-fpm.sock;
            fastcgi_index index.php;

            # 关键：PHP执行脚本绝对路径（必填）
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            # 引入全局FastCGI默认参数
            fastcgi_param  QUERY_STRING       $query_string;
            fastcgi_param  REQUEST_METHOD     $request_method;
            fastcgi_param  CONTENT_TYPE       $content_type;
            fastcgi_param  CONTENT_LENGTH     $content_length;
            fastcgi_param  SCRIPT_NAME        $fastcgi_script_name;
            fastcgi_param  REQUEST_URI        $request_uri;
            fastcgi_param  DOCUMENT_URI       $document_uri;
            fastcgi_param  DOCUMENT_ROOT      $document_root;
            fastcgi_param  SERVER_PROTOCOL    $server_protocol;
            fastcgi_param  REMOTE_ADDR        $remote_addr;
            fastcgi_param  REMOTE_PORT        $remote_port;
            fastcgi_param  SERVER_ADDR        $server_addr;
            fastcgi_param  SERVER_PORT        $server_port;
            fastcgi_param  SERVER_NAME        $server_name;
            fastcgi_param  HTTP_COOKIE        $http_cookie;
        }   

        rewrite ^/p/(.*)$ /page.html?cid=$1 last;        
        rewrite ^/a/(.*)$ /page.html?cid=$1 last;        
        
        error_page 404 /404.html;
        location = /40x.html {
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
        }
    }

    server {
        listen       443 ssl http2;
        server_name  localhost;
        server_name  127.0.0.1;
        root ./www;
        
        ssl_certificate "./conf/server.crt";
        ssl_certificate_key "./conf/server.key";
        ssl_session_cache shared:SSL:1m;
        ssl_session_timeout  10m;
        ssl_ciphers PROFILE=SYSTEM;
        ssl_prefer_server_ciphers on;

        location = /install.sh {
        } 

        location = /index.html {
        }  

        # 所有流量转发给本地Gunicorn 127.0.0.1:8000
        location / {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_read_timeout 60s;
        }

        # PHP核心转发规则
        location ~ \.php$ {
            # 转发到PHP-FPM TCP地址
            # fastcgi_pass 127.0.0.1:9000;
            fastcgi_pass unix:/run/php/php8.3-fpm.sock;
            fastcgi_index index.php;

            # 关键：PHP执行脚本绝对路径（必填）
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            # 引入全局FastCGI默认参数
            fastcgi_param  QUERY_STRING       $query_string;
            fastcgi_param  REQUEST_METHOD     $request_method;
            fastcgi_param  CONTENT_TYPE       $content_type;
            fastcgi_param  CONTENT_LENGTH     $content_length;
            fastcgi_param  SCRIPT_NAME        $fastcgi_script_name;
            fastcgi_param  REQUEST_URI        $request_uri;
            fastcgi_param  DOCUMENT_URI       $document_uri;
            fastcgi_param  DOCUMENT_ROOT      $document_root;
            fastcgi_param  SERVER_PROTOCOL    $server_protocol;
            fastcgi_param  REMOTE_ADDR        $remote_addr;
            fastcgi_param  REMOTE_PORT        $remote_port;
            fastcgi_param  SERVER_ADDR        $server_addr;
            fastcgi_param  SERVER_PORT        $server_port;
            fastcgi_param  SERVER_NAME        $server_name;
            fastcgi_param  HTTP_COOKIE        $http_cookie;
        }
   
        rewrite ^/p/(.*)$ /page.html?cid=$1 last;        
        rewrite ^/a/(.*)$ /page.html?cid=$1 last;        
        
        error_page 404 /404.html;
        location = /40x.html {
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
        }
    }
}
